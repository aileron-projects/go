site_name: AILERON | Go
site_url: https://aileron-projects.github.io/go
site_description: AILERON Projects | Go standard package extensions.
site_author: AILERON Projects Community
copyright: Copyright &copy; 2025 AILERON Projects Community.
repo_name: aileron-projects/go
repo_url: https://github.com/aileron-projects/go
edit_uri: edit/main/docs/website/

docs_dir: "./website"
strict: true

extra_css:
  - ./_customize/mkdocs.css
extra_javascript:
  - ./_customize/mathjax.js
  - ./_customize/mermaid.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

exclude_docs: |
  README.md
  *.drawio

theme:
  name: material
  locale: en
  highlightjs: true
  logo: static/aileron.svg
  favicon: static/aileron.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - search.highlight
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.expand
    - navigation.path
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - toc.follow

plugins:
  - search
  - tags
  - i18n:
      languages:
        - locale: en
          name: "English"
          default: false
          build: false
        - locale: ja
          name: "日本語"
          default: true
          build: true

markdown_extensions:
  - abbr
  - attr_list
  - def_list
  - footnotes
  - tables
  - smarty
  - admonition
  - meta
  - md_in_html
  - toc:
      permalink: true
      title: Table of Contents
  - pymdownx.tasklist
  - pymdownx.emoji
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.blocks.caption
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.snippets:
      base_path: "./website"
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  generator: false
  version:
    provider: mike
  # analytics:
  #   provider: google
  #   property: G-XXXXXXX
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aileron-projects/go

nav:
  - Docs:
      - overview: docs/overview/index.md
      - getting-started: docs/getting-started/index.md
      - community: docs/community/index.md
      - contributing: docs/contributing/index.md
  - References:
      - cron: references/cron/index.md
      - debug: references/debug/index.md
      - env: references/env/index.md
      - logging: references/logging/index.md
      - rate: references/rate/index.md
      - tcp: references/tcp/index.md
      - udp: references/udp/index.md
  - Examples: examples/index.md
  - "": index.md
