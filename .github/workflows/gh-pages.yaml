name: Deploy Pages

on:
  push:
    branches:
      - "main"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: setup
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          pip install mkdocs mkdocs-material mkdocs-material-extensions mkdocs-static-i18n mike
      - name: latest
        if: github.ref == 'refs/heads/main'
        run: |
          cd docs/
          mike deploy latest --update-aliases
          mike set-default latest
          git push origin gh-pages
      - name: version
        if: github.ref_type == 'tag'
        run: |
          cd docs/
          mike deploy ${{github.ref_name}}
          git push origin gh-pages
